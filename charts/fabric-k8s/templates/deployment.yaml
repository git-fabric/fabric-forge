apiVersion: apps/v1
kind: Deployment
metadata:
  name: fabric-k8s
  labels:
    app: fabric-k8s
    fabric-sdk/component: fabric
    fabric-sdk/as: "65002"
    fabric-sdk/layer: L7
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: fabric-k8s
  template:
    metadata:
      labels:
        app: fabric-k8s
        fabric-sdk/component: fabric
        fabric-sdk/as: "65002"
        fabric-sdk/layer: L7
    spec:
      serviceAccountName: fabric-k8s
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: k8s
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "bin/cli.js"]
          ports:
            - containerPort: {{ .Values.config.port }}
              protocol: TCP
          env:
            - name: MCP_HTTP_PORT
              value: "{{ .Values.config.port }}"
            - name: GATEWAY_URL
              value: "{{ .Values.config.gatewayUrl }}"
            - name: OLLAMA_ENDPOINT
              value: "{{ .Values.config.ollamaEndpoint }}"
            - name: OLLAMA_MODEL
              value: "{{ .Values.config.ollamaModel }}"
            - name: K8S_IN_CLUSTER
              value: "true"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.config.port }}
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.config.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
