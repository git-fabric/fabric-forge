apiVersion: v1
kind: Service
metadata:
  name: fabric-dashboard
  labels:
    app: fabric-dashboard
    fabric-sdk/component: dashboard
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 80
      nodePort: {{ .Values.service.nodePort }}
      protocol: TCP
  selector:
    app: fabric-dashboard
